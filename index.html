  <script>
    (function() {
      try {
        var saved = localStorage.getItem('theme');
        var isDark = saved ? (saved === 'dark') : true;
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Live Server Auto-Reload Client (detects local file edits instantly when livereload server is running) -->
  <script>
    (function() {
      if (location.protocol === 'file:') return;
      let lastTimestamp = null;
      let failCount = 0;
      function checkLiveChanges() {
        if (failCount > 3) return; // Stop polling on static hosts without live reload server
        fetch('/__livereload?_t=' + Date.now())
          .then(function(res) {
            if (!res.ok) throw new Error('No live reload endpoint');
            return res.json();
          })
          .then(function(data) {
            failCount = 0;
            if (lastTimestamp !== null && data.timestamp && data.timestamp !== lastTimestamp) {
              console.log('[LiveServer] Code changes detected! Auto-reloading page...');
              location.reload();
            }
            lastTimestamp = data.timestamp;
            setTimeout(checkLiveChanges, 800);
          })
          .catch(function() {
            failCount++;
            if (failCount <= 3) {
              setTimeout(checkLiveChanges, 2000);
            }
          });
      }
      checkLiveChanges();
    })();
  </script>
